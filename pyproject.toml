[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trino-catalog-setup"
version = "0.1.0"
description = "Vault-backed catalog setup for an existing Trino cluster"
requires-python = ">=3.11"
dependencies = ["trino==0.336.0", "requests>=2.32.4,<3", "sqlglot==30.12.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
trino-setup = "trino_setup.__main__:main"

[tool.setuptools.packages.find]
include = ["trino_setup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
trino_setup = ["assets/trino/*.txt"]
